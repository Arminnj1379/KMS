server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static hardening (the API carries its own helmet headers; these cover
  # the SPA shell). No CSP here: connect-src would have to hardcode the
  # API origin and break non-default VITE_API_URL deployments.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Vite emits content-hashed filenames under /assets — safe to cache hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
